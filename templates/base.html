<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Kape De Manubag{% endblock %}</title>
  {% load static %}
  <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Non-blocking font load: preload the CSS as a high-priority resource,
       then swap it to a stylesheet once loaded so it never blocks rendering.
       The noscript fallback ensures fonts still load without JS. -->
  <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap"
        onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap">
  </noscript>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/mobile-design-system.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}

  
  <!-- Toast container inserted by JS -->
  <!-- Django messages -->
  {% if messages %}
  <div class="messages-container">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">
      <span>{{ message }}</span>
      <button class="alert-dismiss">×</button>
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <script>
    // Single source of truth for JS endpoint URLs (generated by Django's
    // URL resolver so routes can change without breaking the front end).
    window.KDM_URLS = {
      packagingFee: '{% url "orders:packaging_fee_preview" %}',
      posCreate:    '{% url "orders:create_pos_order" %}',
      posDraftStatus: '{% url "orders:pos_draft_status" %}',
      realtimeStream: '{% url "realtime:event_stream" %}',
      customerOrderStream: '{% url "realtime:customer_order_stream" %}',
      chartData:    '{% url "dashboard:chart_data" %}',
      dashboardSummary: '{% url "dashboard:summary" %}',
    };
  </script>
  <script src="{% static 'js/main.js' %}"></script>
  {% block realtime_js %}{% endblock %}
  {% block extra_js %}{% endblock %}
</body>
</html>
