{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Kape De Manubag</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@400;600&display=swap"
        onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@400;600&display=swap">
  </noscript>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/mobile-design-system.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body style="background:var(--cream-light);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;font-family:'DM Sans',sans-serif">

  <div style="font-size:4rem;margin-bottom:16px">☕</div>
  <h1 style="font-family:'Playfair Display',serif;font-size:clamp(1.8rem,5vw,3rem);color:var(--brown-dark);margin-bottom:12px">
    Page Not Found
  </h1>
  <p style="color:#888;font-size:1rem;max-width:360px;margin-bottom:32px;line-height:1.6">
    We couldn't find that page. It may have been moved or the link may be incorrect.
  </p>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
    <a href="/" style="background:var(--brown-mid);color:var(--cream);padding:14px 28px;border-radius:10px;text-decoration:none;font-weight:600;font-size:1rem;display:inline-flex;align-items:center;gap:8px">
      🍽️ View Menu
    </a>
    <a href="javascript:history.back()" style="background:transparent;color:var(--brown-mid);padding:14px 28px;border-radius:10px;text-decoration:none;font-weight:600;font-size:1rem;border:2px solid var(--brown-mid);display:inline-flex;align-items:center;gap:8px">
      ← Go Back
    </a>
  </div>

</body>
</html>
